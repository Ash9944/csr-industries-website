<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CSR Industries</title>
  <script>
    // GitHub Pages SPA redirect trick
    // Encodes the path into a query param so index.html can restore it
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/' +
      '?p=' + encodeURIComponent(l.pathname + l.search) + l.hash
    );
  </script>
</head>
<body></body>
</html>
